<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakunawa at the window</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Montserrat", sans-serif;
      color: #f1e6d2;
      background-color: #0b0f20;
      background-image: linear-gradient(rgba(11, 15, 32, 0.88), rgba(11, 15, 32, 0.88)), url(img/patterns/eight-point-star-band.svg);
      background-size: auto, 1120px 420px;
    }

    .box {
      width: 90%;
      max-width: 560px;
      padding: 40px 30px;
      text-align: center;
      background: #050918;
      border: 2px solid #ffd7c2;
      border-radius: 6px;
    }

    h1 {
      margin: 0 0 10px;
      font-weight: 500;
      font-size: 32px;
    }

    p {
      margin: 0 0 30px;
      color: #c9bfb0;
      line-height: 1.5;
    }

    a {
      display: block;
      margin-top: 14px;
      padding: 16px;
      color: #f1e6d2;
      text-decoration: none;
      border: 1px solid #ffd7c2;
      border-radius: 4px;
    }

    a:hover {
      background: #ffd7c2;
      color: #050918;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bakunawa at the window</h1>
    <p>Choose which screen to open on this device.</p>
    <a href="question-screen.html">Question screen</a>
    <a href="story-screen.html">Story screen</a>
  </div>
</body>
</html>
