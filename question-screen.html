<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bakunawa at the window · Question screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E4DCCB; --card:#EDE6D7; --text:#221B12; --muted:#6B5F4D; --line:#BFB29A;
  --btn:#F2ECDF; --on:#1F6E67; --on-text:#F6F1E6; --gong:#A86B12; --gong-text:#FFF7E6;
  --serif:"Fraunces",Georgia,serif; --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sub:"ivypresto-display","Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --q-serif:"Montserrat",system-ui,sans-serif;
  --q-sans:"Montserrat",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#141821; --card:#1A1F2A; --text:#E8DFCC; --muted:#9A9182; --line:#3A3F4B;
    --btn:#1D222D; --on:#3E9C92; --on-text:#0F141C; --gong:#D9A441; --gong-text:#1A1206; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#141821; --card:#1A1F2A; --text:#E8DFCC; --muted:#9A9182; --line:#3A3F4B;
  --btn:#1D222D; --on:#3E9C92; --on-text:#0F141C; --gong:#D9A441; --gong-text:#1A1206; color-scheme:dark;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--on);outline-offset:2px}

#landing{max-width:640px;margin:0 auto;padding:48px 16px}
#landing h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,5vw,44px);line-height:1.08;margin:0 0 24px;letter-spacing:-0.01em}
.roles{display:grid;gap:10px}
.role{display:block;width:100%;text-align:left;background:var(--btn);border:1px solid var(--line);border-radius:3px;padding:16px 18px;cursor:pointer}
.role strong{display:block;font-family:var(--serif);font-weight:500;font-size:22px}
.role:hover{border-color:var(--on)}

#wrap{max-width:1440px;margin:0 auto;padding:20px 16px 40px}
body.role-p #wrap{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){body.role-p #wrap{grid-template-columns:1fr}}
body.role-s #wrap{padding:0;max-width:none}

/* question screen: Bakunawa Questions design */
body.role-q #wrap{padding:0;max-width:none}
#qwrap{position:relative;background:var(--qbg,#232323);color:var(--qtext,#ECE9E3);font-family:"Space Grotesk",system-ui,sans-serif;transition:background-color 1.4s ease,color 1.6s ease;overflow:hidden;--qmuted:#A19D95;--qline:rgba(236,233,227,.5)}
body.role-q{transition:background-color 1.4s ease}
body.role-q #qwrap{min-height:100vh;min-height:100dvh}
body.role-p #qwrap{border-radius:3px}
.qsky{position:absolute;inset:0;pointer-events:none}
.qsky i{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
#qview{position:relative;max-width:1000px;margin:0 auto;padding:96px 48px 72px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:72px}
.q-segs{display:flex;gap:8px}
.q-segs i{display:block;width:56px;height:3px;transition:background-color .6s ease,opacity .6s ease}
.q-counter{font-size:15px;letter-spacing:.04em;color:var(--qmuted);font-variant-numeric:tabular-nums}
.q-eyebrow{margin:0 0 18px;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--qmuted)}
.q-head{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:clamp(36px,5vw,60px);line-height:1.08;letter-spacing:-0.02em;margin:0 0 56px;text-wrap:pretty;opacity:0;transform:var(--htf,translateY(10px));transition:opacity .6s ease,transform .6s ease}
.entered .q-head{opacity:1;transform:none}
.q-opts{display:flex;flex-direction:column;gap:20px}
.q-opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:32px;width:100%;min-height:116px;padding:0 44px;text-align:left;background:transparent;color:var(--qtext);border:1px solid var(--qline);border-radius:0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:clamp(20px,2.4vw,27px);cursor:pointer;opacity:0;transform:var(--tf);transition:opacity var(--d) var(--e) var(--dl),transform var(--d) var(--e) var(--dl),border-color .25s,background-color .25s,color .25s}
.entered .q-opt{opacity:1;transform:none}
.q-opt .fill{position:absolute;inset:0;background:var(--sw);opacity:.16;transform-origin:left center;transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.q-opt .num{position:relative;font-size:15px;letter-spacing:.08em;color:var(--qmuted);font-variant-numeric:tabular-nums;transition:color .3s}
.q-opt .lbl{position:relative;flex:1}
.q-opt .dia{position:relative;width:14px;height:14px;background:var(--sw);transform:rotate(45deg) scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1);flex:none}
.q-opts:not(.picking) .q-opt:hover{border-color:var(--sw)}
.q-opts:not(.picking) .q-opt:hover .fill{transform:scaleX(1)}
.q-opts:not(.picking) .q-opt:hover .num{color:var(--qtext)}
.q-opts:not(.picking) .q-opt:hover .dia{transform:rotate(45deg) scale(1)}
.q-opt[aria-pressed="true"]{background:var(--sw);border-color:var(--sw);color:var(--pt)}
.q-opt[aria-pressed="true"] .fill{transform:scaleX(0)}
.q-opt[aria-pressed="true"] .num{color:var(--pt)}
.q-opt[aria-pressed="true"] .dia{transform:rotate(45deg) scale(1.3)}
.q-opts.picking .q-opt{transition-delay:0s}
.entered .q-opts.picking .q-opt:not([aria-pressed="true"]){opacity:.35}
.q-opt:focus-visible,.q-cta:focus-visible,.q-link:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.q-cta{width:100%;min-height:116px;padding:0 44px;display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--ac);color:var(--act);border:1px solid var(--ac);border-radius:0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:27px;font-weight:500;cursor:pointer;margin:0 0 48px;transition:background-color .6s ease,transform .2s;animation:pulse 1.7s ease-in-out infinite}
.q-cta:active{transform:scale(.99)}
.q-cta .dia{width:14px;height:14px;background:var(--act);transform:rotate(45deg);flex:none}
@keyframes pulse{50%{opacity:.84}}
.q-rows{border-top:1px solid var(--qline)}
.q-row{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--qline)}
.q-row .k{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--qmuted)}
.q-row .v{font-size:clamp(18px,2vw,22px);min-width:0}
.q-row .q-link{grid-column:2;grid-row:1/3}
.q-foot{margin-top:auto;padding-top:64px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.q-foot .left{display:flex;gap:24px}
.q-link{background:none;border:0;padding:8px 0;color:var(--qmuted);font-family:"Space Grotesk",system-ui,sans-serif;font-size:16px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.q-link:hover{color:var(--qtext)}
/* beat: a pause between questions that sends the eyes up */
.beat-body{transition:opacity 1.6s ease}
.beat.resting .beat-body{opacity:.6}
.beat-dia{width:14px;height:14px;background:var(--qtext);transform:rotate(45deg);margin:0 0 40px;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25;transform:rotate(45deg) scale(.6)}}
.beat .q-head{margin-bottom:20px}
.beat-sub{margin:0 0 64px;font-size:clamp(18px,2vw,24px);color:var(--qmuted);opacity:0;transition:opacity .9s ease .6s}
.entered .beat-sub{opacity:1}
.beat-bar{position:relative;width:100%;height:2px;background:var(--qline);overflow:hidden;margin:0 0 40px}
.beat-bar i{position:absolute;inset:0;background:var(--qtext);transform-origin:left center;transform:scaleX(0);animation:beatfill var(--dwell) linear forwards}
.beat .beat-bar i{transform:translateX(-40%) scaleX(.4);animation:beatwait 1.8s ease-in-out infinite}
.beat.ready .beat-bar i{animation:none;transform:none;transition:transform .5s ease}
@keyframes beatwait{to{transform:translateX(140%) scaleX(.4)}}
@keyframes beatfill{to{transform:scaleX(1)}}
.q-next{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;min-height:116px;padding:0 44px;background:transparent;color:var(--qtext);border:1px solid var(--sw);border-radius:0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:clamp(20px,2.4vw,27px);cursor:pointer;opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease,background-color .25s,color .25s}
.q-next .dia{width:14px;height:14px;background:var(--sw);transform:rotate(45deg);flex:none}
.beat.ready .q-next{opacity:1;transform:none}
.q-next:not(:disabled):hover{background:var(--sw);color:var(--pt)}
.q-next:not(:disabled):hover .dia{background:var(--pt)}
.q-next:disabled{cursor:default}
.q-next:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.q-next.on{opacity:1;transform:none}
/* welcome */
.intro-lede{margin:0 0 48px;max-width:34ch;font-size:clamp(19px,2.2vw,25px);line-height:1.45;color:var(--qtext);opacity:0;transition:opacity .9s ease .3s}
.entered .intro-lede{opacity:1}
.intro-steps{list-style:none;margin:0 0 48px;padding:0;border-top:1px solid var(--qline)}
.intro-steps li{display:grid;grid-template-columns:56px 1fr;gap:4px 16px;padding:20px 0;border-bottom:1px solid var(--qline);opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease;transition-delay:calc(.5s + var(--i) * .15s)}
.entered .intro-steps li{opacity:1;transform:none}
.intro-steps .n{grid-row:1/3;font-size:15px;letter-spacing:.08em;color:var(--qmuted);font-variant-numeric:tabular-nums;padding-top:4px}
.intro-steps b{font-weight:500;font-size:clamp(19px,2vw,23px)}
.intro-steps span{color:var(--qmuted);font-size:clamp(15px,1.6vw,18px)}
.q-fine{margin:0;font-size:14px;color:var(--qmuted);letter-spacing:.02em}
/* gong moment */
.gong-note{margin:-24px 0 0;font-size:clamp(16px,1.8vw,20px);color:var(--qmuted)}
/* ending */
.end-sub{margin:0 0 48px;max-width:34ch;font-size:clamp(19px,2.2vw,25px);line-height:1.45;color:var(--qmuted)}
.keep{display:flex;align-items:center;gap:32px;padding:28px 0;border-top:1px solid var(--qline);border-bottom:1px solid var(--qline);margin:0 0 40px}
.keep-qr{flex:none;width:180px;height:180px;background:#fff;padding:12px}
.keep-qr svg{display:block;width:100%;height:100%}
.keep-qr.off{display:flex;align-items:center;justify-content:center;background:transparent;border:1px dashed var(--qline);color:var(--qmuted);font-size:13px;text-align:center;padding:16px}
.keep b{display:block;font-weight:500;font-size:clamp(20px,2.2vw,26px);margin-bottom:6px}
.keep span{color:var(--qmuted);font-size:clamp(15px,1.6vw,18px)}
/* preview: question screen is the same 16:9 size as the story screen */
body.role-p #wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
body.role-p #qwrap{aspect-ratio:16/9;max-width:100%;overflow-x:hidden;overflow-y:auto;container-type:size}
body.role-p #qview{max-width:none;min-height:100%;padding:6cqh 5cqw 4cqh}
body.role-p .q-top{margin-bottom:5cqh}
body.role-p .q-segs i{width:7cqw}
body.role-p .q-counter{font-size:max(10px,3cqh)}
body.role-p .q-eyebrow{font-size:max(10px,2.8cqh);margin-bottom:1.6cqh}
body.role-p .q-head{font-size:max(15px,7cqh);margin-bottom:4cqh}
body.role-p .q-opts{gap:1.8cqh}
body.role-p .q-opt{min-height:max(30px,10.5cqh);padding:0 3.2cqw;gap:2.4cqw;font-size:max(12px,4cqh)}
body.role-p .q-opt .num{font-size:max(10px,2.8cqh)}
body.role-p .q-cta{min-height:max(34px,11cqh);padding:0 3.2cqw;font-size:max(13px,4.4cqh);margin-bottom:3cqh}
body.role-p .q-row{padding:1.1cqh 0}
body.role-p .q-row .k{font-size:max(9px,2.5cqh)}
body.role-p .q-row .v{font-size:max(12px,3.6cqh)}
body.role-p .q-link{font-size:max(11px,3cqh);padding:0}
body.role-p .q-foot{padding-top:3cqh}
body.role-p .beat-dia{margin-bottom:3cqh}
body.role-p .beat-sub{font-size:max(12px,3.6cqh);margin-bottom:5cqh}
body.role-p .beat-bar{margin-bottom:3cqh}
body.role-p .q-next{min-height:max(30px,10.5cqh);padding:0 3.2cqw;font-size:max(12px,4cqh)}
body.role-p .intro-lede,body.role-p .end-sub{font-size:max(12px,3.6cqh);margin-bottom:4cqh}
body.role-p .intro-steps{margin-bottom:4cqh}
body.role-p .intro-steps li{padding:1.4cqh 0;grid-template-columns:6cqw 1fr}
body.role-p .intro-steps b{font-size:max(12px,3.4cqh)}
body.role-p .intro-steps span,body.role-p .keep span,body.role-p .gong-note,body.role-p .q-fine{font-size:max(10px,2.8cqh)}
body.role-p .keep{padding:2cqh 0;gap:3cqw;margin-bottom:3cqh}
body.role-p .keep-qr{width:22cqh;height:22cqh;padding:1.4cqh}
body.role-p .keep b{font-size:max(12px,3.6cqh)}
@media (max-width:860px){body.role-p #wrap{grid-template-columns:1fr}}
@media (max-width:640px){
  #qview{padding:44px 20px 32px}
  .q-top{margin-bottom:40px}
  .q-segs i{width:40px}
  .q-head{margin-bottom:32px}
  .q-opts{gap:12px}
  .q-opt{min-height:76px;padding:0 22px;gap:18px}
  .q-cta{min-height:84px;padding:0 22px;font-size:22px}
  .q-next{min-height:76px;padding:0 22px}
  .beat-sub{margin-bottom:40px}
  .intro-lede,.end-sub{margin-bottom:32px}
  .keep{flex-direction:column;align-items:flex-start;gap:20px}
}
/* siri-style edge glow: wraps the whole screen, swirls, then drains upward and beams off the top */
@property --sa{syntax:'<angle>';inherits:true;initial-value:0deg}
@property --sw{syntax:'<length>';inherits:true;initial-value:0px}
@property --cut{syntax:'<percentage>';inherits:false;initial-value:-25%}
@property --rise{syntax:'<percentage>';inherits:false;initial-value:125%}
.siri{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:0;--sw:0px;--on:18px;--cut:-25%;--rise:125%;-webkit-mask:linear-gradient(to top,transparent var(--cut),#000 calc(var(--cut) + 22%),#000 var(--rise),transparent calc(var(--rise) + 22%));mask:linear-gradient(to top,transparent var(--cut),#000 calc(var(--cut) + 22%),#000 var(--rise),transparent calc(var(--rise) + 22%));transition:opacity .5s ease,--sw .8s cubic-bezier(.2,.9,.3,1);animation:siriSpin 3.6s linear infinite}
body.role-q .siri,body.role-q .siri-fx{position:fixed}
.stage .siri{--on:26px}
.siri .rw{position:absolute;inset:0}
.siri .b1{filter:blur(0)}
.siri .b2{filter:blur(12px)}
.siri .b3{filter:blur(42px);opacity:.85}
.siri .ring{position:absolute;inset:0;padding:var(--sw);background:conic-gradient(from var(--sa),#F48CAA,#F07828,#F8BE28,#2AB6C8,#2F6FD0,#7846B4,#D6286E,#F48CAA);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.siri .b1 .ring{padding:calc(var(--sw)*.18)}
.siri .b3 .ring{padding:calc(var(--sw)*2.4)}
.siri.in{opacity:1;--sw:var(--on)}
.siri.arrive{opacity:1;--sw:var(--on);transition:none;animation:siriSpin 3.6s linear infinite,siriArrive .8s cubic-bezier(.2,.8,.2,1) forwards}
.siri.shoot{animation:siriSpin 3.6s linear infinite,siriShoot .85s cubic-bezier(.6,0,.35,1) forwards}
@keyframes siriSpin{to{--sa:360deg}}
@keyframes siriArrive{0%{--rise:-25%;--sw:calc(var(--on)*1.8)}100%{--rise:125%;--sw:var(--on)}}
@keyframes siriShoot{0%{--cut:-25%;--sw:var(--on)}30%{--sw:calc(var(--on)*1.6)}100%{--cut:105%;--sw:calc(var(--on)*.4)}}
.siri.arrive-top{opacity:1;--sw:var(--on);transition:none;animation:siriSpin 3.6s linear infinite,siriArriveTop .8s cubic-bezier(.2,.8,.2,1) forwards}
.siri.shoot-down{animation:siriSpin 3.6s linear infinite,siriShootDown .85s cubic-bezier(.6,0,.35,1) forwards}
@keyframes siriArriveTop{0%{--cut:105%;--sw:calc(var(--on)*1.8)}100%{--cut:-25%;--sw:var(--on)}}
@keyframes siriShootDown{0%{--rise:125%;--sw:var(--on)}30%{--sw:calc(var(--on)*1.6)}100%{--rise:-25%;--sw:calc(var(--on)*.4)}}
.siri-fx.down .beam{top:0;bottom:auto;transform:translate(-50%,-100%);background:radial-gradient(ellipse at 50% 0,rgba(255,244,226,.95),rgba(248,190,40,.35) 40%,transparent 70%)}
.siri-fx.down .flare{top:auto;bottom:0;transform:translate(-50%,40%);background:radial-gradient(ellipse at 50% 100%,rgba(255,250,240,.95),rgba(244,140,170,.4) 40%,transparent 72%)}
.siri-fx.down.go .beam{animation-name:siriBeamDown}
.siri-fx.down.go .flare{animation-name:siriFlareDown}
@keyframes siriBeamDown{0%{opacity:0;transform:translate(-50%,-100%) scaleX(1.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,160%) scaleX(.5)}}
@keyframes siriFlareDown{0%{opacity:0}25%{opacity:1}100%{opacity:0;transform:translate(-50%,90%)}}
.siri-fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.siri-fx i{position:absolute;left:50%;opacity:0}
.siri-fx .beam{bottom:0;width:34%;height:70%;transform:translate(-50%,100%);background:radial-gradient(ellipse at 50% 100%,rgba(255,244,226,.95),rgba(248,190,40,.35) 40%,transparent 70%);filter:blur(18px)}
.siri-fx .flare{top:0;width:80%;height:30%;transform:translate(-50%,-40%);background:radial-gradient(ellipse at 50% 0,rgba(255,250,240,.95),rgba(244,140,170,.4) 40%,transparent 72%);filter:blur(10px)}
.siri-fx.go .beam{animation:siriBeam .85s cubic-bezier(.5,0,.3,1) forwards}
.siri-fx.go .flare{animation:siriFlare 1.1s ease-out .55s forwards}
@keyframes siriBeam{0%{opacity:0;transform:translate(-50%,100%) scaleX(1.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scaleX(.5)}}
@keyframes siriFlare{0%{opacity:0}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
#qview{transition:transform .7s cubic-bezier(.2,.9,.3,1),filter .7s ease,opacity .5s ease}
#qwrap.siri-on #qview{transform:scale(.965);filter:brightness(.72) saturate(.9)}
#qwrap.siri-shoot #qview{transform:translateY(-28px) scale(.965);opacity:0;transition:transform .7s cubic-bezier(.6,0,.35,1),opacity .6s ease}
@media (prefers-reduced-motion: reduce){.q-head,.q-opt{opacity:1!important;transform:none!important;transition:none!important}.q-cta{animation:none}.beat-dia{animation:none}.beat-body,.beat-sub,.q-next,.intro-lede,.intro-steps li{transition:none}#qwrap,.qsky i{transition:none}}

/* story stage */
.stage{container-type:size;position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:3px;background:#14122e}
body.role-s #sview{position:fixed;inset:0}
body.role-s .stage{height:100%;aspect-ratio:auto;border-radius:0}
.stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage svg.ghost{pointer-events:none;transition:opacity 1.4s ease}
.subtitle{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(78%,1100px);text-align:center;margin:0;font-family:var(--sub);font-weight:500;font-size:max(14px,5.4cqh);line-height:1.25;color:#f3eadb;text-shadow:0 2px 14px rgba(8,6,26,.85),0 0 2px rgba(8,6,26,.9);text-wrap:balance;transition:opacity .7s ease,transform .7s ease;pointer-events:none;z-index:2}
.subtitle.out{opacity:0;transform:translate(-50%,8px)}
.sctrl{position:absolute;right:1.6%;top:4%;display:flex;gap:6px;transition:opacity .4s;z-index:3}
.sctrl button{background:rgba(0,0,0,.35);color:#F3EAD6;border:1px solid rgba(255,255,255,.25);border-radius:3px;padding:6px 10px;font-size:13px;cursor:pointer}
.sctrl.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){.gong{animation:none}.subtitle,.sctrl,.stage svg.ghost{transition:none}}
/* storybook look: a cloudy night behind, sketched boxes, star progress. No frame on this screen. */
#qwrap{font-family:var(--q-sans);--qbg:#08080b}
.qsky .clouds{opacity:1;inset:-15%;background:radial-gradient(30% 16% at 14% 22%,rgba(var(--cl),.32),transparent 70%),radial-gradient(22% 12% at 34% 34%,rgba(var(--cl),.2),transparent 70%),radial-gradient(26% 13% at 68% 14%,rgba(var(--cl),.26),transparent 70%),radial-gradient(36% 18% at 86% 56%,rgba(var(--cl),.3),transparent 70%),radial-gradient(22% 11% at 66% 72%,rgba(var(--cl),.2),transparent 70%),radial-gradient(32% 16% at 22% 78%,rgba(var(--cl),.28),transparent 70%),radial-gradient(22% 12% at 50% 46%,rgba(255,255,255,.08),transparent 70%),radial-gradient(28% 14% at 56% 94%,rgba(var(--cl),.22),transparent 70%),radial-gradient(18% 10% at 8% 52%,rgba(var(--cl),.18),transparent 70%);filter:blur(30px);animation:clouddrift 80s ease-in-out infinite alternate}
@keyframes clouddrift{to{transform:translate(4%,-2%)}}
.qsky .spk{position:absolute;width:calc(12px * var(--s,1));height:calc(12px * var(--s,1));background:var(--qstar,#fff);clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);opacity:.75;animation:twinkle 4.6s ease-in-out var(--t,0s) infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
#qview{max-width:900px;padding:clamp(56px,10vh,120px) clamp(40px,6vw,64px) clamp(40px,6vh,64px);text-align:center;align-items:center}
.q-stars{order:99;margin-top:auto;padding-top:clamp(28px,6vh,72px);display:flex;gap:clamp(14px,1.8vw,22px);justify-content:center;align-items:center}
.q-stars svg{display:block;width:15px;height:15px;overflow:visible;transition:transform .6s ease}
.q-stars path{fill:none;stroke:var(--qtext);stroke-width:1.1;opacity:.6;transition:fill .6s ease,opacity .6s ease}
.q-stars .done path{fill:var(--qtext);opacity:.55}
.q-stars .cur path{fill:var(--qtext);opacity:1}
.q-stars .cur svg{transform:scale(1.2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.q-eyebrow{font-family:var(--q-sans);font-size:11px;font-weight:400;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:var(--qmuted);margin:0 0 clamp(14px,2.4vh,22px)}
.q-head{font-family:var(--q-serif);font-weight:400;font-size:clamp(30px,4.1vw,50px);line-height:1.14;letter-spacing:0;max-width:30ch;margin:0 auto clamp(28px,6vh,60px);text-wrap:balance}
.q-opts{width:min(400px,100%);gap:clamp(10px,2vh,16px)}
.q-opt,.q-next,.q-cta{position:relative;overflow:visible;justify-content:center;gap:0;width:min(400px,100%);min-height:clamp(44px,6.2vh,56px);padding:0 24px;text-align:center;background:transparent;border:0;font-family:var(--q-sans);font-size:clamp(14px,1.3vw,16px);font-weight:400;letter-spacing:.02em;color:var(--qmuted)}
.q-opt .lbl{flex:none}
.sk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sk path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sk .base{stroke:var(--qline);stroke-width:1;transition:opacity .35s ease}
.sk .sel{stroke:var(--qtext);stroke-width:1.4;opacity:0;transition:opacity .35s ease}
.q-opts:not(.picking) .q-opt:hover,.q-next:not(:disabled):hover,.q-cta:hover{color:var(--qtext);background:transparent}
.q-opts:not(.picking) .q-opt:hover .sel,.q-next:not(:disabled):hover .sel{opacity:.7}
.q-opt[aria-pressed="true"]{background:transparent;color:var(--qtext)}
.q-opt[aria-pressed="true"] .sel,.q-cta .sel{opacity:1}
.q-opt[aria-pressed="true"] .base,.q-cta .base{opacity:0}
.q-cta{color:var(--qtext);font-size:clamp(15px,1.4vw,18px);margin:0 auto clamp(20px,4vh,40px)}
.q-next{margin:0 auto}
.q-next.on{color:var(--qtext)}
.q-next:disabled{opacity:.35}
.beat.ready .q-next{opacity:1}
.q-foot{justify-content:center;padding-top:clamp(18px,3vh,32px)}
.q-link{font-family:var(--q-sans);font-size:13px;letter-spacing:.08em;text-decoration:none;border-bottom:1px solid var(--qline);padding:2px 0}
.intro-lede,.end-sub{margin-left:auto;margin-right:auto;font-family:var(--q-serif);font-style:italic;font-size:clamp(18px,1.9vw,23px);color:var(--qtext);opacity:.85;max-width:36ch}
.intro-steps{border:0;max-width:440px;margin-left:auto;margin-right:auto;margin-bottom:clamp(24px,5vh,48px)}
.intro-steps li{display:block;border:0;padding:clamp(6px,1.2vh,12px) 0}
.intro-steps .n{display:none}
.intro-steps b{display:block;font-weight:400;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--qtext);margin-bottom:4px}
.intro-steps span{font-size:clamp(14px,1.3vw,16px)}
.q-fine{font-size:12px;letter-spacing:.06em}
.beat-dia{width:16px;height:16px;margin:0 auto clamp(20px,4vh,36px);transform:none;clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%)}
@keyframes breathe{50%{opacity:.25;transform:scale(.6)}}
.beat-sub{font-size:clamp(15px,1.5vw,19px)}
.beat-bar{width:min(400px,100%);height:1px;margin:0 auto clamp(24px,4vh,40px)}
.keep{justify-content:center;text-align:left;border-color:var(--qline);max-width:560px;margin-left:auto;margin-right:auto}
.keep b{font-family:var(--q-serif);font-size:clamp(22px,2.2vw,28px)}
.gong-note{margin:0;font-size:clamp(14px,1.4vw,17px)}
.q-cta#gong{animation:pulse 1.7s ease-in-out infinite}
/* the answer boxes: the hand-drawn box (btnframe.svg), 9-sliced so the crayon line keeps its weight at any width */
.q-opt::before,.q-next::before,.q-cta::before{content:"";position:absolute;inset:0;pointer-events:none;border-style:solid;border-width:0;border-image-source:url(img/btnframe.svg?v=1);border-image-slice:11 15;border-image-width:var(--by) var(--bx);border-image-repeat:stretch;opacity:.75;transition:opacity .35s ease,filter .35s ease}
.q-opt::after{content:"";position:absolute;inset:4px 6px;pointer-events:none;background:radial-gradient(ellipse 60% 90% at 50% 50%,rgba(255,205,156,.2),transparent 80%);opacity:0;transition:opacity .35s ease}
.sk{display:none}
.q-opts:not(.picking) .q-opt:hover::before,.q-next:not(:disabled):hover::before{opacity:.85}
.q-opt[aria-pressed="true"]::before,.q-cta::before{opacity:1;filter:drop-shadow(0 0 4px rgba(255,205,156,.45))}
.q-opt[aria-pressed="true"]::after{opacity:1}
/* the frame from the story: woven cloth (canvas.pat) behind, the sky in .win over it, frame.svg on top as a 9-slice border.
   frame.js works out the window and writes --wl --wt --wr --wb --m --fx --fy to #qwrap */
@property --s1{syntax:'<color>';inherits:true;initial-value:#020309}
@property --s2{syntax:'<color>';inherits:true;initial-value:#050918}
@property --s3{syntax:'<color>';inherits:true;initial-value:#0e1528}
@property --f1{syntax:'<color>';inherits:true;initial-value:#ffc4d6}
@property --f2{syntax:'<color>';inherits:true;initial-value:#ffe9ad}
@property --qaccent{syntax:'<color>';inherits:true;initial-value:#f1e6d2}
@property --qframe{syntax:'<color>';inherits:true;initial-value:#ffd7c2}
#qwrap{transition:--s1 1.4s ease,--s2 1.4s ease,--s3 1.4s ease,--f1 1.4s ease,--f2 1.4s ease,--qaccent 1.4s ease,--qframe 1.4s ease,color 1.4s ease}
#qwrap.live{transition-duration:.12s}
#qwrap canvas.pat{position:absolute;inset:0;width:100%;height:100%;display:block}
#qwrap .win{position:absolute;left:var(--wl,0);top:var(--wt,0);right:var(--wr,0);bottom:var(--wb,0);overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--s1),var(--s2) var(--sm,65%),var(--s3) 82%)}
#qwrap .qstars{position:absolute;inset:0;width:100%;height:100%}
#qwrap .qdim{position:absolute;inset:0;background:#05040f;opacity:0;transition:opacity 3s ease}
/* the sky on the big screen goes dark as the moons are swallowed; this one follows */
#qwrap[data-stage="3"] .qdim,#qwrap[data-stage="4"] .qdim{opacity:.38}
#qwrap[data-few] .spk{display:none}
#qwrap .fw{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 4px rgba(255,205,190,.25))}
#qwrap .frame{position:absolute;inset:var(--m,0);border-style:solid;border-width:0;border-image-source:url(img/frame.svg?v=8);border-image-slice:82 98;border-image-width:var(--fy,0) var(--fx,0);border-image-repeat:stretch}
/* the drawn lines become masks where the browser allows, so they can take the story's colours */
@supports (-webkit-mask-box-image:none){
  #qwrap .frame{border-image:none;background:linear-gradient(120deg,var(--f1),var(--f2));-webkit-mask-box-image:url(img/frame.svg?v=8) 82 98 / var(--fy,0) var(--fx,0) stretch}
  .q-opt::before,.q-next::before,.q-cta::before{border-image:none;background:var(--qframe);-webkit-mask-box-image:url(img/btnframe.svg?v=1) 11 15 / var(--by) var(--bx) stretch}
}
.q-opt::after{background:radial-gradient(ellipse 60% 90% at 50% 50%,color-mix(in srgb,var(--qframe) 20%,transparent),transparent 80%)}
.q-opt[aria-pressed="true"]::before,.q-cta::before{filter:none}
#qview{z-index:2;max-width:none;width:100%;padding:calc(var(--wt,48px) + clamp(14px,3.4vh,40px)) calc(var(--wr,48px) + 20px) calc(var(--wb,48px) + clamp(10px,2.2vh,24px)) calc(var(--wl,48px) + 20px)}
/* type: Montserrat Medium, kept small so the big screen stays the main event */
#qwrap h1,#qwrap p,#qwrap b,#qwrap span,#qwrap button{font-family:var(--q-sans);font-weight:500;font-style:normal}
.q-head{font-size:clamp(21px,2.7vw,34px);line-height:1.28;letter-spacing:-.005em;max-width:32ch;margin-bottom:clamp(16px,3.4vh,36px)}
.q-eyebrow{font-size:11px;letter-spacing:.34em;text-indent:.34em}
.q-opt,.q-next,.q-cta{font-size:clamp(14px,1.25vw,16px);letter-spacing:.01em}
.q-opt{color:var(--qtext)}
.intro-lede,.end-sub{font-size:clamp(15px,1.5vw,18px);line-height:1.5;opacity:1;color:var(--qmuted)}
.keep b{font-size:clamp(17px,1.7vw,21px)}
.q-foot{margin-top:0;padding-top:clamp(8px,1.6vh,16px)}
/* the words sit in the middle of the window, the star row stays at the foot */
#qview>.q-head{margin-top:auto}
.beat .q-head{margin-bottom:clamp(20px,4vh,40px)}
.beat:not(.ready) .q-next{visibility:hidden} /* the button stays out of the way until the story hands back */
.beat{margin-block:auto;width:100%;display:flex;flex-direction:column;align-items:center}
.q-stars{padding-top:clamp(10px,2.4vh,28px)}
/* sliders: the question and the answer are one gesture; the screen around them is the preview */
.q-slide{display:flex;flex-direction:column;align-items:center;width:min(440px,100%);opacity:0;transition:opacity .6s ease .15s}
.entered .q-slide{opacity:1}
.q-slide.sent{pointer-events:none}
.entered .q-slide.sent{opacity:.55}
.q-read{margin:0 0 clamp(4px,1.2vh,12px);min-height:1.5em;font-size:clamp(14px,1.25vw,16px);color:var(--qtext)}

.sl-track{position:relative;height:var(--t)}
.sl input{-webkit-appearance:none;appearance:none;position:absolute;inset:0;display:block;width:100%;height:100%;margin:0;background:transparent;cursor:grab;touch-action:pan-y}
.sl input:active{cursor:grabbing}
.sl input:focus{outline:none}
.sl input::-webkit-slider-runnable-track{height:100%;background:transparent}
.sl input::-moz-range-track{height:100%;background:transparent}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:var(--t);height:var(--t);border:0;background:transparent}
.sl input::-moz-range-thumb{width:var(--t);height:var(--t);border:0;border-radius:0;background:transparent}
.sl-line,.sl-star{position:absolute;top:50%;pointer-events:none;background:var(--qframe)}
.sl-line{left:0;right:0;height:15px;transform:translateY(-50%);-webkit-mask:var(--line) center/100% 100% no-repeat;mask:var(--line) center/100% 100% no-repeat}
.sl-star{left:calc(var(--t)/2 + (100% - var(--t))*var(--p,0));width:var(--t);height:var(--t);transform:translate(-50%,-50%);transition:transform .18s ease;-webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat}
.sl input:active~.sl-star{transform:translate(-50%,-50%) scale(1.12)}
.sl input:focus-visible~.sl-star{background:var(--qtext)}
.sl-ends{display:flex;justify-content:space-between;gap:12px;margin-top:3px;font-size:12px;letter-spacing:.02em;color:var(--qmuted)}
.q-send{margin:clamp(8px,1.6vh,16px) auto 0;animation:none}
.q-send:disabled{cursor:default}
.q-moon{position:relative;width:clamp(72px,15vh,150px);aspect-ratio:1;margin:0 0 clamp(8px,1.8vh,18px)}
.q-moon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.q-moon .ink{position:absolute;inset:0;-webkit-mask:url(img/moon.svg?v=1) center/contain no-repeat;mask:url(img/moon.svg?v=1) center/contain no-repeat}
.q-moon .veil{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--cl),.75),rgba(var(--cl),.32) 62%,transparent)}
.q-wave{display:block;width:100%;height:clamp(44px,9vh,76px);margin:0 0 clamp(6px,1.4vh,14px);overflow:visible}
.q-wave path{fill:none;stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion: reduce){.q-slide{opacity:1;transition:none}#qwrap,#qwrap .qdim{transition:none}}
/* the welcome sits in the middle of the dark */
.welcome{margin:auto 0;display:flex;flex-direction:column;align-items:center;padding-bottom:4vh}
.welcome .intro-lede{max-width:none;text-wrap:balance;margin-bottom:clamp(28px,6vh,56px)}
@media (prefers-reduced-motion: reduce){.qsky .clouds,.qsky .spk{animation:none}}
/* sizing: everything on this screen is measured in --u, one step that follows the screen. It is made for an
   iPad held either way (about 19-21px), and grows on bigger tablets and shrinks to a floor on phones.
   --tap is the smallest height anything you press may be */
#qwrap{--u:clamp(15px,min(2.6vw,2.3vh),26px);--tap:max(48px,calc(var(--u)*3.1));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body.role-q{overscroll-behavior:none}
#qwrap button,#qwrap input{touch-action:manipulation}
#qview{padding:calc(var(--wt,48px) + var(--u)*1.4) calc(var(--wr,48px) + var(--u)*1.4) calc(var(--wb,48px) + var(--u)*.8) calc(var(--wl,48px) + var(--u)*1.4)}
.q-head{font-size:calc(var(--u)*1.7);line-height:1.26;max-width:25em;margin-bottom:calc(var(--u)*1.9)}
.q-opts{width:min(calc(var(--u)*25),100%);gap:calc(var(--u)*.75)}
.q-opt,.q-next,.q-cta{width:min(calc(var(--u)*25),100%);min-height:var(--tap);padding:calc(var(--u)*.5) calc(var(--u)*1.2);font-size:var(--u);line-height:1.3}
.q-cta{margin:0 auto}
/* sliders */
.q-slide{width:min(calc(var(--u)*30),100%)}
.q-read{margin:0 0 calc(var(--u)*.3);min-height:1.4em;font-size:var(--u);line-height:1.4}
.sl{--t:calc(var(--u)*4.6);margin:0 0 calc(var(--u)*1.3)}
#qwrap .sl input{touch-action:none}
.sl-line{height:calc(var(--u)*.8)}
.sl input.held~.sl-star{transform:translate(-50%,-50%) scale(1.12)}
.sl-ends{margin-top:calc(var(--u)*.15);font-size:max(13px,calc(var(--u)*.8));line-height:1.3}
.sl-ends span:last-child{text-align:right}
.q-send{margin:0 auto}
.q-moon{width:min(calc(var(--u)*8),14vh);margin:0 0 calc(var(--u)*.9)}
.q-wave{height:calc(var(--u)*4.2);margin:0 0 calc(var(--u)*.7)}
/* the small links are still full-height targets for a finger */
.q-foot{padding-top:calc(var(--u)*.5)}
.q-foot .left{gap:calc(var(--u)*1.2)}
.q-link{display:inline-flex;align-items:center;min-height:44px;padding:0 calc(var(--u)*.6);border-bottom:0;font-size:max(14px,calc(var(--u)*.85));letter-spacing:.04em;text-decoration:underline;text-decoration-color:var(--qline);text-underline-offset:.3em}
.q-stars{gap:calc(var(--u)*1.1);padding-top:var(--u)}
.q-stars svg{width:var(--u);height:var(--u)}
/* the welcome, the wait and the ending */
.welcome .q-head{font-size:calc(var(--u)*2.2);margin-bottom:calc(var(--u)*.8)}
.intro-lede,.end-sub{font-size:calc(var(--u)*1.05)}
.welcome .intro-lede{margin-bottom:calc(var(--u)*2.4)}
.welcome{padding-bottom:0}
.beat-dia{width:var(--u);height:var(--u);margin-bottom:calc(var(--u)*1.4)}
.beat .q-head{margin-bottom:calc(var(--u)*1.6)}
.beat-bar{width:min(calc(var(--u)*25),100%);margin:0 auto calc(var(--u)*1.6)}
.end-sub{margin-bottom:calc(var(--u)*1.6)}
.keep{gap:calc(var(--u)*1.6);width:min(calc(var(--u)*30),100%);max-width:none;padding:calc(var(--u)*1.3) 0;margin:0 auto calc(var(--u)*1.6)}
.keep-qr{width:max(132px,calc(var(--u)*8.5));height:max(132px,calc(var(--u)*8.5));padding:calc(var(--u)*.5)}
.keep b{font-size:calc(var(--u)*1.15)}
.keep span{font-size:calc(var(--u)*.95);line-height:1.4}
@media (max-width:560px){.keep{flex-direction:column;text-align:center}}
/* a tablet with the browser's bars showing, or a small phone: the same stack, drawn tighter */
@media (max-height:720px) and (min-aspect-ratio:4/3){
  .q-moon{width:11vh;margin-bottom:calc(var(--u)*.5)}
  .q-head{margin-bottom:calc(var(--u)*.9)}
  .sl{--t:calc(var(--u)*3.8);margin-bottom:calc(var(--u)*.8)}
}
@media (max-height:680px) and (max-aspect-ratio:1/1){
  .q-head{font-size:calc(var(--u)*1.45);margin-bottom:calc(var(--u)*.9)}
  .sl{--t:calc(var(--u)*3.8);margin-bottom:calc(var(--u)*.7)}
  .q-wave{height:calc(var(--u)*2.6)}
  .keep{padding:calc(var(--u)*.7) 0;margin-bottom:calc(var(--u)*.8);gap:calc(var(--u)*.6)}
  .keep-qr{width:104px;height:104px}
  .end-sub{margin-bottom:calc(var(--u)*.7)}
}
/* a phone on its side: too short to stack, so the question sits beside its answers */
@media (max-height:540px) and (min-aspect-ratio:4/3){
  #qwrap{--u:clamp(13px,3.6vh,16px);--tap:44px}
  #qview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr auto auto 1fr auto;column-gap:calc(var(--u)*2);justify-items:center;padding-top:calc(var(--wt,48px) + 6px);padding-bottom:calc(var(--wb,48px) + 4px)}
  #qview>.q-head{grid-column:1;grid-row:2;margin:0;font-size:calc(var(--u)*1.45)}
  #qview>.q-opts,#qview>.q-slide{grid-column:2;grid-row:1/5;align-self:center}
  #qview>.q-opts{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:6px}
  #qview>.q-opts .q-opt{font-size:calc(var(--u)*.92);padding:4px 10px}
  #qview>.q-foot{grid-column:1;grid-row:3;padding-top:10px}
  #qview>.q-stars{grid-column:1/-1;grid-row:5;padding-top:2px}
  #qview>.q-stars svg{width:11px;height:11px}
  #qview>.welcome,#qview>.beat,#qview>.q-stars+.q-head:last-child{grid-column:1/-1;grid-row:1/5;align-self:center}
  .q-moon{position:absolute;display:none}
  .q-wave{display:none}
  .q-read{display:none}
  .sl{--t:52px;margin-bottom:6px}
  .sl-line{height:11px}
  #qview>.end-sub{grid-column:1;grid-row:3;margin:4px 0 0}
  #qview>.keep{grid-column:2;grid-row:1/3;align-self:end;flex-direction:row;padding:0;margin:0;border:0;text-align:left}
  #qview>.keep .keep-qr{width:96px;height:96px;padding:6px}
  #qview>.beat-bar{display:none}
  #qview>#finish{grid-column:2;grid-row:3/5;align-self:start;margin-top:8px}
}
/* the story's look: its sky with its paper over it (facets, mottle, grain, dark corners), held a little quieter than the big screen */
#qwrap{--bx:calc(var(--u)*.95);--by:calc(var(--u)*.7)}
#qwrap .qtex{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:overlay;opacity:.72}
#qwrap .qvig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 75% at 50% 45%,rgba(7,6,26,0) 55%,rgba(7,6,26,.36) 100%)}
.qsky .clouds{opacity:.5}
/* every word is white, whatever the sky has become */
.q-opt,.q-next,.q-cta,.q-link,.q-read,.sl-ends,.intro-lede,.end-sub,.beat-sub,.gong-note,.keep span{color:var(--qtext)}
#qview{text-shadow:0 1px 8px rgba(7,6,26,.3),0 0 2px rgba(52,22,66,var(--qglow,0)),0 1px 3px rgba(52,22,66,var(--qglow,0)),0 0 .9em rgba(52,22,66,var(--qglow,0))}
.beat.resting .beat-body{opacity:1}
.q-opt::before,.q-next::before,.q-cta::before{opacity:.9}
/* the question sits a little above the middle, with the way on (Continue, Back) lower down, over the stars */
#qview.asked>.q-head{margin-top:0}
#qview.asked::before,#qview.asked::after{content:"";flex:1 1 0}
#qview.asked::before{order:-1}
#qview.asked::after{order:98;flex-grow:.45}
#qview.asked>.q-opts,#qview.asked>.q-slide{flex:.8 1 auto}
#qview.asked>.q-opts{justify-content:flex-start}
.q-send{margin-top:auto}
.sl{margin-bottom:calc(var(--u)*1.5)}
@media (max-height:540px) and (min-aspect-ratio:4/3){
  #qview.asked::before,#qview.asked::after{display:none}
  #qview.asked>.q-head{margin-top:0}
  #qview.asked>.q-opts,#qview.asked>.q-slide{flex:none}
  .sl{margin-bottom:6px}
  #qwrap{--bx:12px;--by:9px}
}
</style>
</head>

<div id="wrap">
  <div id="qcol" hidden><div id="qwrap"><canvas class="pat" aria-hidden="true"></canvas><div class="win" aria-hidden="true"><div class="qsky"><i class="clouds"></i><canvas class="qstars"></canvas><b class="spk" style="left:15%;top:17%;--t:0s"></b><b class="spk" style="left:87%;top:61%;--t:-2.1s"></b><b class="spk" style="left:79%;top:14%;--s:.6;--t:-3.4s"></b><b class="spk" style="left:9%;top:72%;--s:.55;--t:-1.2s"></b></div><canvas class="qtex"></canvas><i class="qvig"></i><i class="qdim"></i></div><div class="fw" aria-hidden="true"><div class="frame"></div></div><section id="qview"></section></div></div>
  <div id="scol" hidden style="min-width:0">
    <section id="sview">
      <div class="stage" id="stage">
        <svg id="scene" viewBox="0 -30 1028 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The Bakunawa story drawn as a moon arc over a mountain and sea"></svg>
        <p class="subtitle out" id="sub" aria-live="polite"></p>
        <div class="sctrl" id="sctrl">
          <button id="sound">Turn on sound</button>
          <button id="fs">Full screen</button>
        </div>
      </div>
    </section>
  </div>
</div>

  function keepURL(){

      sel+='M'+f(x-sx*4+r(.6))+' '+f(y-sy*4+r(.6))+'h'+f(sx*9+r(.8))+'v'+f(sy*9+r(.8))+'h'+f(-sx*9+r(.8))+'z'+ln(x+sx*9,y+sy*2.5,x+sx*15,y+sy*2.5,.6);}

    if(RMQ){done();return;}

  /* an answer leaves: the screen settles on it, and it goes up to the big screen with the glow */

  function drawMoon(T){

    const tick=now=>{

  /* the star sits where the slider is */
  const placeStar=i=>i.parentNode.style.setProperty('--p',((i.value-i.min)/(i.max-i.min)).toFixed(3));
  function syncSlide(T){
    const Q=QS[qi],read=el.querySelector('#read');

      const k=Math.min(1,Math.max(0,(e.clientX-r.left-t/2)/(r.width-t)));

    const Q=QS[qi];

        '<div class="welcome">'+

        }).join('')+'</div>')+

      el.innerHTML=top(T)+
        '<div class="beat" style="--dwell:'+dwell+'ms">'+
          '<div class="beat-body">'+
            '<div class="beat-dia" aria-hidden="true"></div>'+
            '<h1 class="q-head">Watch the big screen</h1>'+
          '</div>'+
          '<div class="beat-bar" aria-hidden="true"><i></i></div>'+
          '<button class="q-next" id="next" disabled><span>Next question</span>'+sketch(53+qi)+'</button>'+
        '</div>';

         the timer is only a fallback for when the big screen isn't connected */
      const ready=()=>{
        if(b.classList.contains('ready')||!b.isConnected)return;beatReady=null;
        b.classList.remove('resting');b.classList.add('ready');nx.disabled=false;
        try{nx.focus({preventScroll:true});}catch(e){}

      beatT.push(setTimeout(ready,dwell+3000));
    }else{
      el.innerHTML=top(T)+
        (stage>=5?
          '<h1 class="q-head released">It let the moon go.</h1>':

  }
  document.addEventListener('keydown',e=>{
    if(phase==='intro'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();phase='q';qi=0;publish();render();return;}
    if(phase==='beat'){if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();nextQ();}return;}

}

/* ================= story screen ================= */
function Story(bus,role){

  const COLOURS={

    sky1:'#121443',sky2:'#262170',haze:'#5a3fa6',cloud:'#0e1038',
    arc:'#b9a8ee',lit:'#efe3c8',dark:'#3a3672',crater:'#d9c9b8',star:'#fbecc8',
    mount:'#1c2154',mountA:'#2a3270',mountB:'#33407e',mountC:'#232a63',mountD:'#2b3874',ridge:'#6d8fd0',
    sea:'#1a1c4c',horizon:'#c9b4f0',serpent:'#3fb3a2',gold:'#f6c47c',
    bands:['#ef7d5e','#f49a74','#d873b4','#7d55c6','#5b82db','#b28be3','#4a3fa0','#6fa8e8','#e08cc8','#3a3f8f','#9a6fd6'],
    water:['#d97fc0','#ef8a64','#4f78d0','#9a78dc','#2d3378','#3e8fc0','#f2b27a']
  };
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  const lerp=(a,b,k)=>a+(b-a)*k;
  function hexToHsl(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;if(mx===mn)return[0,0,l];const d=mx-mn,s=l>0.5?d/(2-mx-mn):d/(mx+mn);const h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;return[h*60,s,l];}
  function hslToHex(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1))));return'#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');}

    if(st.line==='linework')return{fill:col,'fill-opacity':0.06,stroke:col,'stroke-width':1.5,'stroke-linejoin':'round',opacity:Math.min(1,opacity+0.1)};

  }
  function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  let R=mulberry32(st.seed);
  const j=(v,a)=>v+(R()*2-1)*a;
  function el(name,attrs={},parent){const e=document.createElementNS(NS,name);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
  function smooth(pts){let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}return d;}
  const smoothCont=pts=>smooth(pts).replace(/^M/,'L');
  const starPath=(x,y,s,w=0.16)=>`M${x},${y-s}L${x+s*w},${y-s*w}L${x+s},${y}L${x+s*w},${y+s*w}L${x},${y+s}L${x-s*w},${y+s*w}L${x-s},${y}L${x-s*w},${y-s*w}Z`;

  /* fixed scene data */
  const NB=12;
  const BOUND=Array.from({length:NB},(_,i)=>({yC:418+i*5,yE:232+(i>0?50+(i-1)*27:0),A:46+(i%3)*7,f:4.1+i*0.04,ph:i*0.16,sp:0.35+(i%4)*0.06}));

  const PHASE_TABLE=[[0,63,1],[24,36,0.72],[40,30,0.5],[55,24,0.3],[66,10,0.12],[82,3,0]];
  function slotProps(theta){const a=Math.abs(theta);for(let i=0;i<PHASE_TABLE.length-1;i++){const[a0,r0,k0]=PHASE_TABLE[i],[a1,r1,k1]=PHASE_TABLE[i+1];if(a<=a1){const t=(a-a0)/(a1-a0);return{r:r0+(r1-r0)*t,k:k0+(k1-k0)*t};}}return{r:3,k:0};}

  /* textures */

      mottleA:mk(90,58,(d,i)=>{const v=90+tr()*80;d[i]=v;d[i+1]=v*0.95;d[i+2]=v*0.9;d[i+3]=255;}),
      mottleB:mk(360,234,(d,i)=>{const v=90+tr()*80;d[i]=v;d[i+1]=v*0.95;d[i+2]=v*0.9;d[i+3]=255;}),

  /* story state */
  let stage=0,released=false,gongHits=0,stage4At=0,lastGong=null,lastKey='',linked=false;

  function build(fade){

    for(let i=0;i<st.stars;i++){

    }
    const sparks=st.dense?[[355,238,6],[672,236,6],[140,268,4],[880,262,4],[260,120,5],[780,110,5],[60,60,4],[960,70,4]]:st.stars>20?[[355,238,6],[672,236,6],[140,268,4],[880,262,4]]:[[355,238,5]];
    sparks.forEach(([x,y,s])=>el('path',{d:starPath(x,y,s,0.22),fill:C('star'),opacity:0.85},G.sky));

    G.arc=el('g',{},svg);
    G.serp=el('g',{},svg);
    G.moons=el('g',{},svg);

    G.star=el('g',{},svg);
    el('circle',{cx:CX,cy:292,r:80,fill:`url(#gGlow${B})`},G.star);
    el('line',{x1:CX,y1:186,x2:CX,y2:446,stroke:C('star'),'stroke-width':1.3,opacity:0.75},G.star);
    el('line',{x1:CX-60,y1:292,x2:CX+60,y2:292,stroke:C('star'),'stroke-width':0.8,opacity:0.35},G.star);
    el('path',Object.assign({d:starPath(CX,292,34)},look(C('star'))),G.star);
    el('path',{d:starPath(CX,372,10,0.2),fill:C('star'),opacity:0.8},G.star);

    G.waves=el('g',st.line==='painted'?{filter:`url(#fBrush${B})`}:{},svg);
    for(let i=0;i<NB-1;i++){
      [-1,1].forEach(side=>{

    const poly=(pts,key,o=1)=>el('polygon',Object.assign({points:pts.map(p=>p.join(',')).join(' ')},look(C(key),o)),G.mount);
    poly([[0,522],[90,508],[170,516],[260,538],[0,538]],'mountC',0.95);
    poly([[1028,520],[940,506],[860,514],[770,538],[1028,538]],'mountC',0.95);
    poly([[190,538],[300,505],[380,490],[430,465],[490,438],[520,452],[560,443],[620,470],[700,500],[800,520],[860,538]],'mount');
    poly([[490,438],[455,505],[520,452]],'mountA');
    poly([[560,443],[540,500],[620,470]],'mountB');
    poly([[520,452],[540,500],[470,522],[455,505]],'mountC');
    poly([[620,470],[700,500],[600,526],[540,500]],'mountD');
    poly([[300,505],[380,490],[350,530]],'mountA');
    el('path',{d:'M490,438L455,505L400,532M560,443L540,500L562,536M380,490L350,530',fill:'none',stroke:C('ridge'),'stroke-width':1.2,opacity:0.55,'stroke-dasharray':st.line==='dotted'?'0.1 6':'none','stroke-linecap':'round'},G.mount);

    G.sea=el('g',{},svg);
    el('rect',{x:-100,y:HORIZON,width:W+200,height:H-HORIZON+100,fill:C('sea')},G.sea);
    el('rect',{x:-100,y:HORIZON-1,width:W+200,height:2.5,fill:C('horizon'),opacity:0.6},G.sea);
    for(let y=HORIZON+5,row=0;y<H+30;row++){
      const h=3+R()*6,g=el('g',{},G.sea);
      const depth=clamp((y-HORIZON)/(H-HORIZON));
      let x=-60+R()*40;
      while(x<W+40){
        const w=24+R()*190*(0.6+depth);
        const near=Math.abs(x+w/2-CX)<90;
        const pool=near?[1,6,0,3]:BASE.water.map((_,k)=>k);

        if(R()>0.25)el('rect',Object.assign({x:x.toFixed(1),y:y.toFixed(1),width:w.toFixed(1),height:h.toFixed(1),rx:h/2},look(col,0.55+(1-depth)*0.4)),g);

    G.fx=el('g',{},svg);

    const facets=el('g',{style:'mix-blend-mode:overlay',opacity:0.9},svg);
    const step=56,pts=[];
    for(let gy=-2;gy<=Math.ceil(H/step)+2;gy++){const r=[];for(let gx=-1;gx<=Math.ceil(W/step)+1;gx++)r.push([gx*step+j(0,20),gy*step+j(0,20)]);pts.push(r);}

    }

    el('image',{href:textureURLs.mottleB,x:0,y:-40,width:W,height:H+80,preserveAspectRatio:'none',style:'mix-blend-mode:overlay',opacity:0.2},svg);
    el('rect',{x:-100,y:-100,width:W+200,height:H+200,fill:`url(#pGrain${B})`,style:'mix-blend-mode:overlay',opacity:0.16},svg);

  }

  /* per-frame pieces */
  function boundaryY(i,u,side,tm){
    const b=BOUND[i],tt=clamp((u-28)/560),ease=1-Math.pow(1-tt,2.4);
    return b.yC+(b.yE-b.yC)*ease+b.A*(1+gongEnv*0.7)*Math.sin(tt*b.f+b.ph+side*0.6+tm*b.sp*(1+gongEnv*3))*Math.pow(tt,0.7);
  }
  function waves(tm){
    const us=[];for(let u=26;u<=600;u+=14)us.push(u);
    const line=(i,side)=>us.map(u=>[CX+side*u,boundaryY(i,u,side,tm)]);
    waveEls.forEach(({el,i,side})=>{const top=line(i,side),bot=line(i+1,side).reverse();el.setAttribute('d',smooth(top)+smoothCont(bot)+'Z');});
    streakEls.forEach(({el,i,side})=>el.setAttribute('d',smooth(line(i,side).map(([x,y])=>[x,y+5]))));
  }
  function moon(g,x,y,r,k,litSide,o,eclipse,idx){
    if(o<0.01)return;
    const lit=C('lit'),dark=C('dark');
    const grp=el('g',{opacity:o.toFixed(2)},g);
    if(idx===0&&r>30)el('circle',{cx:x,cy:y,r:r*1.9,fill:`url(#gGlow${B})`,opacity:(0.5*(1-eclipse)).toFixed(2)},grp);
    el('circle',Object.assign({cx:x,cy:y,r},look(lit)),grp);
    if(st.line==='painted'&&r>14){
      const cr=mulberry32(Math.round(SLOTS[idx]*13+idx));
      for(let n=0;n<5;n++){const a=cr()*6.28,d=cr()*r*0.6;el('circle',{cx:x+Math.cos(a)*d,cy:y+Math.sin(a)*d,r:r*(0.1+cr()*0.18),fill:C('crater'),opacity:0.35},grp);}
    }
    if(k<0.995){
      const semi=litSide>0?0:1,term=k<0.5?semi:1-semi,rx=Math.max(0.01,r*Math.abs(1-2*k));
      const d=`M${x},${y-r}A${r},${r} 0 0 ${semi} ${x},${y+r}A${rx},${r} 0 0 ${term} ${x},${y-r}Z`;
      if(st.line==='painted')el('path',{d,fill:dark,opacity:0.92},grp);
      else el('path',Object.assign({d},look(lit),{fill:dark,'fill-opacity':0.5}),grp);
    }
    if(eclipse>0.01){
      // the serpent's shadow slides across the moon
      const id='cm'+idx+B,cp=el('clipPath',{id},grp);
      el('circle',{cx:x,cy:y,r:r+0.5},cp);
      el('circle',{cx:x+(1-eclipse)*r*2.1,cy:y-r*0.12,r:r*1.04,fill:C('sky1'),opacity:0.94,'clip-path':`url(#${id})`},grp);
    }
  }
  function drawSky(tm){
    G.arc.innerHTML='';G.serp.innerHTML='';G.moons.innerHTML='';
    // faint arc the moons travel
    const arcPts=rx=>{const p=[];for(let a=-82;a<=82;a+=3)p.push(arcPos(a,rx,rx-28));return p;};
    el('path',{d:smooth(arcPts(400)),fill:'none',stroke:C('arc'),'stroke-width':1,opacity:0.4},G.arc);
    el('path',{d:smooth(arcPts(432)),fill:'none',stroke:C('arc'),'stroke-width':0.8,opacity:0.18},G.arc);
    // serpent rising out of the sea and along the arc
    if(serpLen>0.01){
      const a0=-104,a1=a0+serpLen*182,body=[];
      for(let a=a0;a<=a1;a+=2){const off=8*Math.sin(a*0.12+tm*0.8);body.push(arcPos(a,400+off,372+off));}
      if(body.length>1){
        el('path',{d:smooth(body),fill:'none',stroke:C('serpent'),'stroke-width':9,'stroke-linecap':'round',opacity:0.6,'stroke-dasharray':st.line==='dotted'?'0.1 9':'none'},G.serp);
        el('path',{d:smooth(body),fill:'none',stroke:tf('#d8fff2'),'stroke-width':2,'stroke-dasharray':'1 7','stroke-linecap':'round',opacity:0.5},G.serp);
        const[hx,hy]=body[body.length-1],[px,py]=body[body.length-2];
        const ang=Math.atan2(hy-py,hx-px)*180/Math.PI;
        el('ellipse',{cx:hx,cy:hy,rx:16,ry:10,transform:`rotate(${ang.toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)})`,fill:C('serpent'),opacity:0.8},G.serp);
        const ex=hx+Math.cos((ang-35)*Math.PI/180)*8,ey=hy+Math.sin((ang-35)*Math.PI/180)*8;
        el('circle',{cx:ex,cy:ey,r:2,fill:C('star')},G.serp);
      }
    }
    const shift=st.motion==='orbit'?tm*5:0;
    SLOTS.forEach((base,i)=>{
      let th=base;
      if(shift)th=((base+shift+82)%164+164)%164-82;
      let{r,k}=slotProps(th),[x,y]=arcPos(th);
      let o=clamp((82-Math.abs(th))/12);
      if(i===0){
        // the visitor's moon: starts alone and large, settles onto the arc
        x=lerp(CX,x,vis.arc);y=lerp(300,y,vis.arc);r=lerp(92,r,vis.arc);k=kNow;
        moon(G.moons,x,y,r,k,th<0?1:-1,o,ecl,0);
      }else{
        const gone=clamp(swallow-RANK[i]);
        o*=vis.arc*(1-0.94*gone);
        moon(G.moons,x,y,r,k,th<0?1:-1,o,0,i);
      }
    });
  }
  function drawFx(){
    G.fx.innerHTML='';
    rings=rings.filter(r0=>t-r0<2.4);
    for(const r0 of rings){const age=t-r0;el('path',{d:`M${CX-age*560},${HORIZON}A${age*560},${age*500} 0 0 1 ${CX+age*560},${HORIZON}`,fill:'none',stroke:C('gold'),'stroke-width':2.5,opacity:((1-age/2.4)*0.55).toFixed(3)},G.fx);}
  }
  function draw(){
    const m=st.motion;
    G.sky.setAttribute('opacity',vis.sky.toFixed(3));
    G.arc.setAttribute('opacity',vis.arc.toFixed(3));
    G.serp.setAttribute('opacity',vis.serp.toFixed(3));
    G.sea.setAttribute('opacity',vis.sea.toFixed(3));
    G.waves.setAttribute('opacity',vis.waves.toFixed(3));
    G.mount.setAttribute('opacity',vis.mount.toFixed(3));
    G.star.setAttribute('opacity',vis.star.toFixed(3));
    if(vis.waves>0.005)waves(m==='drift'||m==='orbit'?mt:mt*0.25);
    drawSky(mt);
    drawFx();
    rowEls.forEach(({el,row,y})=>el.setAttribute('transform',m==='tide'?`translate(${(Math.sin(mt*0.7+y*0.09)*(5+row*0.35)).toFixed(1)},0)`:''));
    const tw=m!=='still';
    twinkles.forEach(s=>s.el.setAttribute('opacity',(tw?s.base*(0.55+0.45*Math.sin(mt*s.sp+s.ph)):s.base).toFixed(2)));
  }

  /* stages */
  function targets(){
    return{
      sky:stage>=1?1:0.35,arc:stage>=1?1:0,sea:stage>=2?1:0,serp:stage>=2?1:0,
      waves:stage>=4?1:0,mount:stage>=4?1:0,star:stage>=5?1:0
    };
  }
  let subTimer=null;
  function setSub(text){
    clearTimeout(subTimer);
    subEl.classList.add('out');
    subTimer=setTimeout(()=>{subEl.textContent=text;if(text)subEl.classList.remove('out');},RM?0:700);
  }
  function pub(){bus.publish({stage});}
  function setStage(n){
    if(n===stage)return;
    stage=n;
    if(n===4){gongHits=0;stage4At=t;}
    setSub(SUBS[n]);pub();
  }
  function release(){if(stage===4){released=true;setStage(5);}}

  /* audio */
  let actx=null,soundOn=true;
  function ensureAudio(){
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}
    if(actx&&actx.state==='suspended')actx.resume().then(updateSoundBtn,()=>{});
    updateSoundBtn();
  }
  const audioOn=()=>actx&&actx.state==='running'&&soundOn;
  function updateSoundBtn(){soundBtn.textContent=audioOn()?'Mute':'Turn on sound';}
  function clang(){
    if(!audioOn())return;
    const n=actx.currentTime,out=actx.createGain();out.gain.value=0.22;out.connect(actx.destination);
    const base=150+Math.random()*30;
    [1,2.76,5.4,8.93].forEach((r,i)=>{const o=actx.createOscillator();o.type='sine';o.frequency.value=base*r;const gn=actx.createGain();gn.gain.setValueAtTime(0.0001,n);gn.gain.exponentialRampToValueAtTime(0.6/(i+1),n+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,n+2.4/(i*0.6+1));o.connect(gn).connect(out);o.start(n);o.stop(n+2.6);});
    const len=Math.floor(actx.sampleRate*0.25),buf=actx.createBuffer(1,len,actx.sampleRate),data=buf.getChannelData(0);
    for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const src=actx.createBufferSource();src.buffer=buf;const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=0.8;const ng=actx.createGain();ng.gain.value=0.5;
    src.connect(bp).connect(ng).connect(out);src.start(n);
  }
  function gong(){
    gongEnv=1;rings.push(t);clang();
    if(stage===4){gongHits++;if(gongHits>=3)setTimeout(release,900);}
  }

  /* incoming answers */
  bus.onStatus(ok=>{linked=ok;});
  bus.on(s=>{
    const a=sanitizeA(s.a);
    let n=0;for(const Q of QS){if(a[Q.id]==null)break;n++;}
    const M=MOONS[a.moon||'full'];
    st.k=M.k;
    st.motion=RM?'still':(a.sound||'drift');
    const key=M.line+'|'+(a.sky||'deep')+'|'+(a.stars==null?1:a.stars);
    if(key!==lastKey){
      const first=lastKey==='';
      lastKey=key;st.line=M.line;st.colour=COLOURS[a.sky||'deep'];st.stars=STARS[a.stars==null?1:a.stars];st.dense=a.stars===2;
      build(!first);
    }
    if(n<4)released=false;
    setStage(n<4?n:(released?5:4));
    const g=typeof s.gong==='number'?s.gong:0;
    if(lastGong!==null&&g>lastGong)gong();
    lastGong=g;
  });

  /* loop */
  let last=performance.now(),prevDraw=0;
  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min(0.06,(now-last)/1000);last=now;t+=dt;
    if(st.motion!=='still')mt+=dt;
    const T=targets(),rate=RM?1:dt*0.9;
    for(const k in vis)vis[k]+=(T[k]-vis[k])*Math.min(1,rate);
    const sl=stage>=3?1:stage===2?0.42:0;
    serpLen+=(sl-serpLen)*Math.min(1,RM?1:dt*0.5);
    const swT=(stage===3||stage===4)?8:0;
    swallow+=clamp(swT-swallow,-dt*2.4,dt*0.9);if(RM)swallow=swT;
    const eT=(stage===3||stage===4)?0.82:0;
    ecl+=(eT-ecl)*Math.min(1,RM?1:dt*(eT>ecl?0.5:1.4));
    const kT=stage>=5?1:st.k;
    kNow+=(kT-kNow)*Math.min(1,RM?1:dt*0.8);
    gongEnv*=Math.exp(-dt*2.5);
    if(stage===4&&t-stage4At>30)release();
    if(now-prevDraw<33)return;
    prevDraw=now;draw();
  }

  /* controls */
  soundBtn.addEventListener('click',()=>{if(audioOn())soundOn=false;else{soundOn=true;ensureAudio();}updateSoundBtn();});
  document.getElementById('fs').addEventListener('click',()=>{try{const r=stageEl.requestFullscreen&&stageEl.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(e){}});
  stageEl.addEventListener('click',e=>{if(e.target.closest('button'))return;ensureAudio();if(stage===4)gong();});
  let hideT=null;
  function wake(){sctrl.classList.remove('hide');clearTimeout(hideT);if(role==='s')hideT=setTimeout(()=>sctrl.classList.add('hide'),3000);}
  stageEl.addEventListener('pointermove',wake);wake();
  if(role==='s'){
    document.addEventListener('keydown',e=>{
      ensureAudio();
      if(e.key==='f'||e.key==='F'){try{stageEl.requestFullscreen&&stageEl.requestFullscreen();}catch(err){}}
      else if(e.key==='g'||e.key==='G'){if(stage===4)gong();}
    });
  }

  makeTextures();build(false);lastKey='painted|deep|1';pub();updateSoundBtn();
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
